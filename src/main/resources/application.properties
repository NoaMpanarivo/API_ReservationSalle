spring.application.name=Reservation_Salles

#faire lire .env à Spring
spring.config.import=optional:file:.env[.properties]

#connection a la base de donnees postgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret=${JWT_SECRET}

# Le pilote JDBC officiel pour PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

#show-sql=true : affiche les requêtes SQL générées.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Creer manuellement avec flyway
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false